# .github/workflows/profile-3d.yml
# Generates the 3D contribution calendar (profile-3d-contrib).
# Place at: .github/workflows/profile-3d.yml in the SAME repo as your profile README.
name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # change to "master" if your default branch is master

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: manrajchauhan

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3D contribution calendar" || exit 0
          git push
